<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>白泽写作</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* 启动异常兜底:避免出现"一片白板"看不到任何线索 */
    (function () {
      var shown = false;
      function report(msg, extra) {
        if (shown) return;
        shown = true;
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;color:#c00;' +
          'padding:24px;font:13px/1.7 -apple-system,monospace;white-space:pre-wrap;overflow:auto';
        box.textContent = '白泽写作启动失败\n\n' + msg + (extra ? '\n\n' + extra : '') +
          '\n\n请截图发给开发者。';
        document.body.appendChild(box);
      }
      window.addEventListener('error', function (e) {
        report((e.message || 'unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        report('Promise 异常: ' + (r && (r.stack || r.message) ? (r.stack || r.message) : String(r)));
      });
    })();
  </script>
</head>
<body>

<!-- ===================== 书架 ===================== -->
<div id="view-shelf" class="view active">
  <header class="topbar">
    <h1>书架</h1>
    <button class="icon-btn" id="btn-search" title="搜索">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    </button>
    <button class="icon-btn" id="btn-tools" title="创作工具">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9l-4.3 3.9 1.2 5.7L12 15.7 7.6 18.6l1.2-5.7L4.5 9l5.6-1.4L12 2z"/></svg>
    </button>
    <button class="icon-btn" id="btn-stats" title="统计">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M5 20V10h3v10H5zm5.5 0V4h3v16h-3zM16 20v-7h3v7h-3z"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19.14 12.94a7.6 7.6 0 0 0 .06-.94 7.6 7.6 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.68 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.6 7.6 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </header>

  <div class="search-wrap hidden" id="search-wrap">
    <svg class="sw-ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <input id="search-input" type="search" placeholder="搜书名、章节名、正文" autocomplete="off">
    <button id="search-cancel" class="sw-cancel">取消</button>
  </div>

  <div class="group-bar" id="group-bar"></div>
  <div class="shelf-scroll">
    <div id="resume-card" class="resume-card hidden"></div>
    <div id="search-result" class="search-result hidden"></div>
    <div id="book-grid" class="book-grid"></div>
  </div>
  <button class="fab" id="btn-new-book">＋</button>
</div>

<!-- ===================== 目录 ===================== -->
<div id="view-catalog" class="view">
  <header class="topbar">
    <button class="icon-btn" id="btn-cat-back">←</button>
    <div class="title-block">
      <h2 id="cat-book-name">书名</h2>
      <span id="cat-book-meta">0 字 · 0 章</span>
    </div>
    <button class="icon-btn" id="btn-cat-more">⋯</button>
  </header>
  <div class="cat-scroll">
    <div id="catalog-body"></div>
  </div>
  <button class="fab" id="btn-new-chapter">＋</button>
</div>

<!-- ===================== 编辑器 ===================== -->
<div id="view-editor" class="view">
  <header class="topbar editor-top">
    <button class="icon-btn" id="btn-ed-back">←</button>
    <input id="ed-title" class="ed-title" type="text" placeholder="章节名" autocomplete="off">
    <button class="icon-btn" id="btn-ed-voice" title="语音输入">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
    </button>
    <button class="icon-btn" id="btn-ed-more" title="更多">⋯</button>
  </header>
  <div class="ed-meta">
    <span id="ed-words">0 字</span>
    <span id="ed-speed" class="ed-speed"></span>
    <span id="ed-status" class="saved">已保存</span>
  </div>
  <div id="voice-hint" class="voice-hint hidden">
    <span id="voice-hint-text">🎤 点键盘上的麦克风键说话,说完文字自动进来</span>
    <button id="voice-hint-close">知道了</button>
  </div>
  <textarea id="ed-text" class="ed-text" placeholder="开始写作…" spellcheck="false"></textarea>
  <button id="btn-exit-immersive" class="exit-immersive hidden">退出沉浸</button>
  <div class="ed-footer">
    <button id="ed-tool-history" class="tool-btn">历史</button>
    <button id="ed-tool-find" class="tool-btn">查找</button>
    <button id="ed-tool-quick" class="tool-btn">快捷</button>
    <button id="ed-tool-type" class="tool-btn">排版</button>
    <button id="ed-tool-reading" class="tool-btn">阅读</button>
  </div>
</div>

<!-- ===================== 统计 ===================== -->
<div id="view-stats" class="view">
  <header class="topbar">
    <button class="icon-btn" id="btn-stats-back">←</button>
    <h2>写作统计</h2>
  </header>
  <div class="stats-scroll">
    <div class="stat-cards" id="stat-cards"></div>
    <div class="chart-card">
      <h3>近 14 天字数</h3>
      <canvas id="stat-chart" height="160"></canvas>
    </div>
    <div class="chart-card">
      <h3>写作记录</h3>
      <div id="stat-list" class="stat-list"></div>
    </div>
    <button class="report-entry" id="btn-annual">查看年度报告 →</button>
  </div>
</div>

<!-- ===================== 设置 ===================== -->
<div id="view-settings" class="view">
  <header class="topbar">
    <button class="icon-btn" id="btn-set-back">←</button>
    <h2>设置</h2>
  </header>
  <div class="set-scroll" id="settings-body"></div>
</div>

<!-- ===================== 通用抽屉 ===================== -->
<div id="sheet-mask" class="sheet-mask hidden"></div>
<div id="sheet" class="sheet hidden">
  <div class="sheet-handle"></div>
  <div id="sheet-body"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/db.js"></script>
<script src="js/voice.js"></script>
<script src="js/update.js"></script>
<script src="js/tools.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
